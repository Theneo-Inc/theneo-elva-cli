name: Feature request
description: Describe a developer or agent workflow need
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and current workaround
